name: Spec line

# Deterministic half of the product-spec check (ADR-0047): the PR
# description carries a `Spec:` line and the rules it names match
# docs/spec/. Cheap and stable, so it can be a required check. The agent
# that judges whether the line is honest is spec-check.yml.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Spec line
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          CHANGED_FILES="$(gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --name-only)"
          export CHANGED_FILES
          node scripts/check-spec-line.ts
