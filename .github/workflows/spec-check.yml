name: Spec check

# Agent review of a PR against the product spec (ADR-0047), following
# .claude/spec-check.md — the same prompt /spec-check runs locally. Advisory:
# it upserts one PR comment and never fails the PR on findings.
#
# Runs when a PR opens (or leaves draft), on every push to it, and on demand:
# comment `/spec-check` on the PR. Each run is an agent session on the
# subscription quota; a newer push cancels a run that is still going.
#
# Trust: the agent reads the PR head — its prompt, the diff and the PR body —
# with the repo's secrets in the environment, so the job runs only for heads
# from this repository (anyone who can push here can change this workflow
# anyway). Fork PRs are skipped on both triggers, project settings are not
# loaded from the checked-out tree, and the agent's shell is limited to
# read-only git commands — no `git fetch`, whose --upload-pack runs arbitrary
# commands.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore:
      - "**/*-snapshots/**"
      - "**/package-lock.json"
  issue_comment:
    types: [created]

jobs:
  spec-check:
    if: |
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/spec-check') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # Job-level, so an unrelated PR comment (skipped by `if`) never cancels
    # a running check; a newer push or `/spec-check` on the same PR does.
    concurrency:
      group: spec-check-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Resolve PR
        id: pr
        run: |
          gh pr view "$PR" --repo "${{ github.repository }}" \
            --json headRefOid,baseRefName,isCrossRepository > "$RUNNER_TEMP/pr.json"
          echo "head=$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefName "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          # The job `if` covers pull_request events; a `/spec-check` comment
          # on a fork PR gets here and must not check out that head.
          if [ "$(jq -r .isCrossRepository "$RUNNER_TEMP/pr.json")" = "true" ]; then
            echo "::notice::PR #$PR comes from a fork — the spec check runs only for branches of this repository."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != 'true'
        with:
          ref: ${{ steps.pr.outputs.head }}
          # Full history, so origin/<base> is present without a fetch.
          fetch-depth: 0

      - name: Write PR description
        if: steps.pr.outputs.skip != 'true'
        run: |
          mkdir -p .spec-check
          gh pr view "$PR" --repo "${{ github.repository }}" --json body --jq .body \
            > .spec-check/pr-body.md

      - name: Run spec check
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow .claude/spec-check.md for PR #${{ env.PR }}.
            Base: origin/${{ steps.pr.outputs.base }}. Head: the checked-out commit.
            PR description: .spec-check/pr-body.md
            Report file: .spec-check/report.md
          # Locally the check runs as the `spec-expert` agent; project agents
          # aren't loaded here (settings sources: user), so the top-level
          # agent gets that agent's model and effort directly.
          claude_args: >-
            --setting-sources user
            --model fable
            --effort xhigh
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git status:*)"

      - name: Post report
        # Not after a cancel: the newer run for this PR is about to post.
        if: ${{ !cancelled() && steps.pr.outputs.skip != 'true' }}
        run: |
          MARKER="<!-- spec-check -->"
          {
            echo "$MARKER"
            if [ -s .spec-check/report.md ]; then
              cat .spec-check/report.md
            else
              echo "## Spec check"
              echo
              echo "The check did not produce a report — see the [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
            echo
            echo "<sub>Advisory, per [ADR-0047](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/adr/0047-product-spec.md). Re-run: comment \`/spec-check\`.</sub>"
          } > "$RUNNER_TEMP/comment.md"
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md"
          fi
