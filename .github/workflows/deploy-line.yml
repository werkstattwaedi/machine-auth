name: Deploy line

# Deterministic half of the deploy-step check (ADR-0049): the PR
# description carries a `Deploy:` line, and the step files it names are the
# ones the PR adds or changes under docs/deploy/, with a header the deploy
# script can read. Cheap and stable, so it can be a required check. Whether
# `none` is honest is the reviewer's call.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Deploy line
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          CHANGED_FILES="$(gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --name-only)"
          export CHANGED_FILES
          node scripts/check-deploy-line.ts
